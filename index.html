<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUTIC School Demo</title><style>:root{--b:#2d6cdf;--t:#3db7a3;--bg:#f7f9fc;--c:#fff;--x:#172033;--m:#667085;--l:#e4e7ec;--r:#e05a5a}*{box-sizing:border-box}body{margin:0;font:15px Inter,system-ui;background:var(--bg);color:var(--x)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef4ff,#effbf8)}.box{width:min(980px,92vw);background:#fff;border-radius:28px;padding:28px;box-shadow:0 20px 60px #2d6cdf20}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--b),var(--t));display:grid;place-items:center;color:#fff;font-weight:900}.hero{margin:22px 0;padding:26px;border-radius:24px;background:linear-gradient(135deg,#eef4ff,#effbf8);display:flex;justify-content:space-between}.roles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.role,.btn{border:0;border-radius:14px;cursor:pointer}.role{padding:18px 10px;background:#fff;border:1px solid var(--l)}.role:hover{border-color:var(--b)}.role span{font-size:30px;display:block}.top{height:70px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 70px)}.side{background:#fff;border-right:1px solid var(--l);padding:18px}.nav button{width:100%;padding:12px;border:0;border-radius:12px;background:transparent;text-align:left;color:#475467;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#edf4ff;color:var(--b);font-weight:700}.main{padding:25px;max-width:1450px;width:100%}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--c);border:1px solid var(--l);border-radius:19px;padding:19px}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}.kpi{font-size:30px;font-weight:900}.muted{color:var(--m)}.btn{padding:10px 14px;font-weight:700}.primary{background:var(--b);color:#fff}.soft{background:#edf4ff;color:var(--b)}.danger{background:#fff0f0;color:var(--r)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:11px;margin:6px 0 12px;background:#fff}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:850px;background:#fff}.table th,.table td{padding:12px;border-bottom:1px solid var(--l);text-align:left}.table th{background:#f4f6f8;color:var(--m);font-size:12px}.tag{padding:5px 9px;border-radius:999px;background:#eaf8f1;color:#237b4b;font-size:12px;font-weight:700}.tag.s{background:#fff4e5;color:#9a5b00}.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mood{border:2px solid transparent;border-radius:16px;padding:15px;background:#f4f6f8;cursor:pointer;text-align:center}.mood.sel{border-color:var(--b);background:#edf4ff}.emoji{font-size:30px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:22px;padding:22px;width:min(700px,95vw);max-height:90vh;overflow:auto}.chart{height:170px;display:flex;align-items:end;gap:12px;padding-top:20px}.bar{flex:1;background:linear-gradient(var(--t),var(--b));border-radius:8px 8px 3px 3px;position:relative}.bar small{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%)}.breath{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#bfeadf,var(--t));display:grid;place-items:center;color:#fff;font-weight:800;margin:20px auto;transition:transform 4s}.breath.in{transform:scale(1.25)}.breath.out{transform:scale(.82)}body.dark{--bg:#111827;--c:#182230;--x:#f8fafc;--m:#b4bdca;--l:#344054}body.dark .top,body.dark .side,body.dark .field,body.dark .table,body.dark .table th,body.dark .modalbox{background:#182230;color:#fff}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.s3,.s4,.s6,.s8{grid-column:span 12}.roles{grid-template-columns:repeat(2,1fr)}.moods{grid-template-columns:repeat(2,1fr)}}</style></head><body><section id="login" class="login"><div class="box"><div class="brand"><div class="logo">N</div><div><h1 style="margin:0">NeuroLumina AUTIC</h1><div class="muted">Helping Before the Meltdown Happens.</div></div></div><div class="hero"><div><h2>Bright Future Inclusive School</h2><p>Functional dummy-data demo for school presentation.</p></div><div style="font-size:55px">🐞</div></div><h3>Choose a workspace</h3><div class="roles"><button class="role" data-role="parent"><span>👩‍👦</span><b>Parent</b></button><button class="role" data-role="child"><span>🧒</span><b>Child</b></button><button class="role" data-role="therapist"><span>🩺</span><b>Therapist</b></button><button class="role" data-role="teacher"><span>👩‍🏫</span><b>Teacher</b></button><button class="role" data-role="admin"><span>⚙️</span><b>Admin</b></button></div></div></section><section id="app" class="hidden"><header class="top"><div class="brand"><div class="logo">N</div><b>AUTIC <span id="roleName" class="muted"></span></b></div><div class="row"><button id="theme" class="btn soft">Dark mode</button><button id="switch" class="btn soft">Switch role</button></div></header><div class="layout"><aside class="side"><nav id="nav" class="nav"></nav></aside><main id="main" class="main"></main></div></section><div id="modal" class="modal hidden"><div class="modalbox"><div class="row between"><h3 id="mt">Details</h3><button id="mc" class="btn soft">Close</button></div><div id="mb"></div></div></div><script>'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const seed={role:'admin',dark:false,calm:8,moods:[['Mon','Happy',9],['Tue','Worried',4],['Wed','Calm',8],['Thu','Overwhelmed',2],['Fri','Happy',9]],users:[{id:1,name:'Riya Sharma',email:'riya.parent@demo.com',role:'Parent',status:'Active',school:'Bright Future Inclusive School',child:'Aarav Sharma'},{id:2,name:'Aarav Sharma',email:'aarav.child@demo.com',role:'Child',status:'Active',school:'Bright Future Inclusive School',child:'—'},{id:3,name:'Dr. Priya Gupta',email:'priya.therapist@demo.com',role:'Therapist',status:'Active',school:'Bright Future Inclusive School',child:'Aarav Sharma'},{id:4,name:'Neha Sharma',email:'neha.teacher@demo.com',role:'Teacher',status:'Active',school:'Bright Future Inclusive School',child:'Aarav Sharma'},{id:5,name:'Mrs. Kavita Mehta',email:'principal@demo.com',role:'School Admin',status:'Active',school:'Bright Future Inclusive School',child:'—'},{id:6,name:'Platform Admin',email:'admin@autic.demo',role:'Platform Admin',status:'Active',school:'NeuroLumina',child:'—'},{id:7,name:'Arjun Verma',email:'arjun.parent@demo.com',role:'Parent',status:'Invited',school:'Sunrise School',child:'Vihaan Verma'}],notes:[{by:'Dr. Priya Gupta',text:'Aarav responded well to a visual schedule and quiet sensory break.'}],observations:[{by:'Neha Sharma',text:'Aarav completed group activity after receiving a two-minute transition warning.'}]};let state=JSON.parse(localStorage.getItem('autic-real-demo')||'null')||seed;let role=state.role,page='dashboard',selected='';const menus={parent:['dashboard','checkin','reports','resources','settings'],child:['dashboard','checkin','calm','achievements'],therapist:['dashboard','children','notes','reports'],teacher:['dashboard','students','observations','reports'],admin:['dashboard','users','schools','resources','analytics','settings']};const labels={dashboard:'Dashboard',checkin:'Mood Check-In',reports:'Reports',resources:'Resources',settings:'Settings',calm:'Calm Space',achievements:'Achievements',children:'Assigned Children',notes:'Session Notes',students:'Students',observations:'Observations',users:'All Users',schools:'Schools',analytics:'Analytics'};function save(){state.role=role;localStorage.setItem('autic-real-demo',JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openApp(r){role=r;page='dashboard';save();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}$$('.role').forEach(b=>b.onclick=()=>openApp(b.dataset.role));$('#switch').onclick=()=>{$('#app').classList.add('hidden');$('#login').classList.remove('hidden')};$('#theme').onclick=()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);save()};$('#mc').onclick=()=>$('#modal').classList.add('hidden');function nav(){const m=menus[role];$('#nav').innerHTML=m.map(x=>`<button data-p="${x}" class="${x===page?'active':''}">${labels[x]}</button>`).join('');$$('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()})}function render(){document.body.classList.toggle('dark',state.dark);$('#roleName').textContent='— '+role[0].toUpperCase()+role.slice(1);nav();$('#main').innerHTML=view();bind()}function view(){if(page==='dashboard')return dashboard();if(page==='users')return users();if(page==='checkin')return checkin();if(page==='calm')return calm();if(page==='reports')return reports();if(page==='notes')return notePage('Therapist Session Notes','notes');if(page==='observations')return notePage('Teacher Observations','observations');if(page==='settings')return settings();if(page==='analytics')return analytics();if(page==='schools')return schools();if(page==='resources')return resources();if(page==='children'||page==='students')return childProfile();if(page==='achievements')return `<h1>Achievements</h1><div class="grid"><div class="card s4"><h3>🌟 First Step</h3><p>Completed first mood check-in.</p></div><div class="card s4"><h3>🌿 One Week Strong</h3><p>Seven days of consistent check-ins.</p></div><div class="card s4"><h3>🌼 Calm Explorer</h3><p>Completed ten Calm Space sessions.</p></div></div>`;return dashboard()}function dashboard(){if(role==='admin')return `<div class="hero"><div><h1>Platform Admin Dashboard</h1><p>Platform status is healthy.</p></div><div style="font-size:52px">🐞</div></div><div class="grid" style="margin-top:16px">${[['Users',state.users.length],['Schools',2],['Mood Check-ins',472],['Calm Sessions',301]].map(x=>`<div class="card s3"><div class="muted">${x[0]}</div><div class="kpi">${x[1]}</div></div>`).join('')}<div class="card s8"><h3>Weekly engagement</h3>${chart()}</div><div class="card s4"><h3>Recent activity</h3><p>User profile updated</p><p>Weekly report generated</p><p>New school invited</p></div></div>`;const names={parent:'Riya',child:'Aarav',therapist:'Dr. Priya',teacher:'Neha'};return `<div class="hero"><div><h1>Welcome, ${names[role]}</h1><p>Your calm workspace is ready.</p></div><div style="font-size:52px">🐞</div></div><div class="grid" style="margin-top:16px"><div class="card s4"><div class="muted">Today's mood</div><div class="kpi">😊 Calm</div></div><div class="card s4"><div class="muted">Current streak</div><div class="kpi">12 days</div></div><div class="card s4"><div class="muted">Calm sessions</div><div class="kpi">${state.calm}</div></div><div class="card s8"><h3>Weekly mood pattern</h3>${chart()}</div><div class="card s4"><h3>Latest note</h3><p>${esc(state.notes[0].text)}</p></div></div>`}function chart(){return `<div class="chart">${state.moods.map(m=>`<div class="bar" style="height:${m[2]*14}px" title="${m[1]}"><small>${m[0]}</small></div>`).join('')}</div>`}function users(){return `<div class="row between"><div><h1>All Users</h1><p class="muted">Manage parents, children, therapists, teachers and administrators.</p></div><div class="row"><button id="export" class="btn soft">Export CSV</button><button id="add" class="btn primary">Add User</button></div></div><div class="row"><input id="q" class="field" style="max-width:330px" placeholder="Search name, email or school"><select id="rf" class="field" style="max-width:200px"><option>All Roles</option><option>Parent</option><option>Child</option><option>Therapist</option><option>Teacher</option><option>School Admin</option></select></div><div id="ut"></div>`}function renderUsers(){const q=$('#q').value.toLowerCase(),rf=$('#rf').value;const a=state.users.filter(u=>(rf==='All Roles'||u.role===rf)&&JSON.stringify(u).toLowerCase().includes(q));$('#ut').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>School</th><th>Linked child</th><th>Action</th></tr></thead><tbody>${a.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)}</span></td><td>${u.role}</td><td><span class="tag ${u.status==='Active'?'':'s'}">${u.status}</span></td><td>${esc(u.school)}</td><td>${esc(u.child)}</td><td><button class="btn soft edit" data-id="${u.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;$$('.edit').forEach(b=>b.onclick=()=>userModal(+b.dataset.id))}function userModal(id){const u=id?state.users.find(x=>x.id===id):{name:'',email:'',role:'Parent',status:'Active',school:'Bright Future Inclusive School',child:'—'};$('#mt').textContent=id?'Edit User':'Add User';$('#mb').innerHTML=`<input id="uid" type="hidden" value="${id||''}"><label>Name</label><input id="un" class="field" value="${esc(u.name)}"><label>Email</label><input id="ue" class="field" value="${esc(u.email)}"><div class="grid"><div class="s6"><label>Role</label><select id="ur" class="field">${['Parent','Child','Therapist','Teacher','School Admin'].map(x=>`<option ${x===u.role?'selected':''}>${x}</option>`).join('')}</select></div><div class="s6"><label>Status</label><select id="us" class="field">${['Active','Invited','Suspended'].map(x=>`<option ${x===u.status?'selected':''}>${x}</option>`).join('')}</select></div></div><label>School</label><input id="usc" class="field" value="${esc(u.school)}"><label>Linked Child</label><input id="uch" class="field" value="${esc(u.child)}"><div class="row between"><button id="del" class="btn danger ${id?'':'hidden'}">Delete</button><button id="sav" class="btn primary">Save User</button></div>`;$('#modal').classList.remove('hidden');$('#sav').onclick=()=>{const d={name:$('#un').value.trim(),email:$('#ue').value.trim(),role:$('#ur').value,status:$('#us').value,school:$('#usc').value,child:$('#uch').value};if(!d.name||!d.email)return alert('Name and email required');if(id)Object.assign(u,d);else state.users.push({id:Date.now(),...d});save();$('#modal').classList.add('hidden');render()};if(id)$('#del').onclick=()=>{if(confirm('Delete this user?')){state.users=state.users.filter(x=>x.id!==id);save();$('#modal').classList.add('hidden');render()}}}function checkin(){return `<h1>How are you feeling today?</h1><div class="card"><div class="moods">${[['😊','Happy'],['😌','Calm'],['😐','Okay'],['😟','Worried'],['😢','Sad'],['😠','Angry'],['😣','Overwhelmed'],['😴','Tired']].map(x=>`<button class="mood" data-m="${x[1]}"><div class="emoji">${x[0]}</div><b>${x[1]}</b></button>`).join('')}</div><textarea id="mn" class="field" rows="4" placeholder="Would you like to add a note?"></textarea><button id="sm" class="btn primary">Save Mood</button></div>`}function calm(){return `<h1>Calm Space</h1><div class="card"><div id="bc" class="breath">Ready</div><h2 id="tm" style="text-align:center">01:00</h2><div class="row" style="justify-content:center"><button id="bs" class="btn primary">Start</button><button id="bp" class="btn soft">Pause</button><button id="br" class="btn soft">Restart</button></div></div>`}function reports(){return `<h1>Weekly Report</h1><div class="grid"><div class="card s8"><h3>Mood Trend</h3>${chart()}</div><div class="card s4"><h3>Summary</h3><p>Most common mood: Calm</p><p>Calm sessions: ${state.calm}</p><p>Teacher observations: ${state.observations.length}</p><button id="csv" class="btn primary">Download CSV</button></div></div>`}function notePage(title,key){return `<h1>${title}</h1><div class="grid"><div class="card s6"><textarea id="nt" class="field" rows="7" placeholder="Write a calm, factual note"></textarea><button id="ns" class="btn primary" data-k="${key}">Share Note</button></div><div class="card s6">${state[key].map(n=>`<p><b>${esc(n.by)}</b><br>${esc(n.text)}</p>`).join('')}</div></div>`}function settings(){return `<h1>Settings</h1><div class="card"><label><input id="dk" type="checkbox" ${state.dark?'checked':''}> Dark mode</label><hr><button id="reset" class="btn danger">Reset Demo Data</button></div>`}function analytics(){return `<h1>Analytics</h1><div class="grid">${[['DAU',614],['Mood completion','78%'],['Calm completion','64%'],['Reports',89]].map(x=>`<div class="card s3"><div class="muted">${x[0]}</div><div class="kpi">${x[1]}</div></div>`).join('')}</div>`}function schools(){return `<h1>Schools</h1><div class="tablewrap"><table class="table"><tr><th>School</th><th>Students</th><th>Teachers</th><th>Status</th></tr><tr><td>Bright Future Inclusive School</td><td>126</td><td>24</td><td><span class="tag">Active</span></td></tr><tr><td>Sunrise School</td><td>88</td><td>18</td><td><span class="tag s">Pilot</span></td></tr></table></div>`}function resources(){return `<h1>Resource Centre</h1><div class="grid">${['Understanding Autism','Sensory Support at School','Visual Schedules','Meltdown vs Tantrum','Parent Wellbeing','Communication Strategies'].map((x,i)=>`<div class="card s4"><span class="tag">${i%2?'School Support':'Daily Tips'}</span><h3>${x}</h3><p class="muted">5 min read</p><button class="btn soft">Open Resource</button></div>`).join('')}</div>`}function childProfile(){return `<h1>Aarav Sharma</h1><div class="grid"><div class="card s4"><h3>Profile</h3><p>Age: 8</p><p>Grade: 3</p></div><div class="card s4"><h3>Sensory Profile</h3><p>Loud sounds uncomfortable</p><p>Enjoys deep pressure</p></div><div class="card s4"><h3>Goals</h3><p>Express feelings independently</p><p>Request sensory breaks</p></div></div>`}function bind(){if(page==='users'){renderUsers();$('#q').oninput=renderUsers;$('#rf').onchange=renderUsers;$('#add').onclick=()=>userModal(0);$('#export').onclick=()=>download('autic-users.csv',['Name,Email,Role,Status,School',...state.users.map(u=>[u.name,u.email,u.role,u.status,u.school].join(','))].join('\n'))}$$('.mood').forEach(b=>b.onclick=()=>{selected=b.dataset.m;$$('.mood').forEach(x=>x.classList.toggle('sel',x===b))});if($('#sm'))$('#sm').onclick=()=>{if(!selected)return alert('Choose a mood');state.moods.push(['Today',selected,{Happy:9,Calm:8,Okay:6,Worried:4,Sad:3,Angry:2,Overwhelmed:2,Tired:5}[selected]]);save();page='dashboard';render()};if($('#ns'))$('#ns').onclick=()=>{const t=$('#nt').value.trim(),k=$('#ns').dataset.k;if(!t)return;state[k].unshift({by:k==='notes'?'Dr. Priya Gupta':'Neha Sharma',text:t});save();render()};if($('#csv'))$('#csv').onclick=()=>download('aarav-report.csv',['Day,Mood,Score',...state.moods.map(x=>x.join(','))].join('\n'));if($('#dk'))$('#dk').onchange=()=>{state.dark=$('#dk').checked;save();render()};if($('#reset'))$('#reset').onclick=()=>{localStorage.removeItem('autic-real-demo');location.reload()};bindBreath()}let timer,sec=60,running=false,phase=0;function bindBreath(){if(!$('#bs'))return;const c=$('#bc'),t=$('#tm');const tick=()=>{if(!running)return;if(sec<=0){clearInterval(timer);running=false;state.calm++;save();c.textContent='Complete';return}sec--;t.textContent='00:'+String(sec).padStart(2,'0');if(sec%4===0){phase++;c.className='breath '+(phase%2?'in':'out');c.textContent=phase%2?'Breathe in':'Breathe out'}};$('#bs').onclick=()=>{if(!running){running=true;timer=setInterval(tick,1000)}};$('#bp').onclick=()=>{running=false;clearInterval(timer);c.textContent='Paused'};$('#br').onclick=()=>{running=false;clearInterval(timer);sec=60;t.textContent='01:00';c.className='breath';c.textContent='Ready'}}function download(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n;a.click()}document.body.classList.toggle('dark',state.dark);</script></body></html>
