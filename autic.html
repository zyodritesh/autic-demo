therapists and educators work from consent-based shared information.')}${featureCard('🌿','Encourage independence','Give children accessible tools to express feelings and practice calming techniques.')}</div></div></section><section class="section"><div class="container"><h2>Designed around real journeys.</h2><div class="grid">${featureCard('👩‍👦','Parent Workspace','Profiles, check-ins, reports, insights, appointments and resources.')}${featureCard('🧒','Child Workspace','A distraction-free environment with one primary action at a time.')}${featureCard('🩺','Therapist Workspace','Assigned children, notes, progress and recommendations.')}${featureCard('🏫','School Workspace','Student observations, reports and parent collaboration.')}${featureCard('⚙️','Operations Console','User management, moderation, analytics and platform settings.')}${featureCard('🎨','Creator Marketplace','Celebrate products and artwork created by autistic individuals.')}</div></div></section>`}function pageHero(title,text){return `<section class="pageHero"><div class="container"><span class="eyebrow">NeuroLumina</span><h1>${title}</h1><p class="lead">${text}</p></div></section>`}function aboutPage(){return pageHero('About NeuroLumina','We build thoughtful, accessible and evidence-informed technology for neurodivergent individuals.')+`<section class="section"><div class="container"><div class="grid"><article class="card c6"><h2>Why we exist</h2><p>Families often juggle appointments, school updates, handwritten notes and emotional observations across multiple tools. NeuroLumina exists to bridge these gaps without replacing professional care.</p></article><article class="card c6"><h2>Our vision</h2><p>To build the world’s most trusted ecosystem of technology that empowers neurodivergent individuals and strengthens the people who support them.</p></article>${featureCard('💙','Empathy','Every decision begins with understanding lived experiences.')}${featureCard('♿','Accessibility','Inclusive design is integrated into every stage.')}${featureCard('🔐','Trust','Users retain control of their information and sharing permissions.')}${featureCard('✨','Simplicity','Technology should reduce cognitive load.')}${featureCard('🤝','Collaboration','Support improves when families and professionals work together.')}${featureCard('🌱','Continuous improvement','Every release should become more useful and inclusive.')}</div></div></section>`}function auticPage(){return pageHero('Introducing AUTIC','An integrated digital platform designed to support autistic individuals and the people who care for them.')+`<section class="section"><div class="container"><h2>Prevention over reaction.</h2><p class="lead">AUTIC helps users recognize emotional patterns early and access practical emotional-regulation tools before distress escalates.</p><div class="grid">${featureCard('😊','Mood Check-ins','Quick emotional logging with optional notes, voice and drawing.')}${featureCard('🌬️','Calm Space','Breathing, grounding, stretching and quiet-timer activities.')}${featureCard('📈','Pattern Insights','Simple visual trends that help caregivers understand recurring patterns.')}${featureCard('📄','Reports','Weekly, monthly and custom reports for authorized users.')}${featureCard('📚','Resource Centre','Trusted articles, guides, videos and downloads.')}${featureCard('🎨','Marketplace','Creator stories and products that celebrate creativity first.')}</div><div class="notice" style="margin-top:24px"><b>AUTIC does not diagnose autism, replace licensed professionals, replace medical advice or guarantee prevention of meltdowns.</b></div></div></section>`}function featuresPage(){return pageHero('Platform features','Every workflow is designed to reduce stress, improve understanding and support independence.')+`<section class="section"><div class="container"><div class="grid">${[['🔑','Secure identity'],['👩‍👦','Parent dashboard'],['🧒','Child experience'],['🩺','Therapist workspace'],['🏫','School workspace'],['🔔','Notifications >Teachers</h1><div class="tableWrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Students</th><th>Status</th></tr><tr><td>Neha Sharma</td><td>neha.teacher@demo.com</td><td>18</td><td><span class="tag">Active</span></td></tr><tr><td>Rahul Singh</td><td>rahul.teacher@demo.com</td><td>22</td><td><span class="tag">Active</span></td></tr></table></div>`}function analyticsScreen(){return `<h1>Analytics</h1>${kpis([['Daily Active Users',614],['Mood Completion','78%'],['Calm Completion','64%'],['Reports Shared',89]])}<div class="grid"><div class="card c8"><h3>Engagement trend</h3>${chart()}</div><div class="card c4"><h3>Top activities</h3><p>Mood Check-in — 472</p><p>Calm Space — 301</p><p>Resources — 188</p><p>Reports — 89</p></div></div>`}function usersScreen(){return `<div class="row between"><div><h1>All Users</h1><p class="muted">Manage platform identities, roles and status.</p></div><div class="row"><button id="exportUsers" class="btn soft">Export CSV</button><button id="addUser" class="btn primary">Add User</button></div></div><div class="row"><input id="userSearch" class="field" style="max-width:330px" placeholder="Search users"><select id="roleFilter" class="field" style="max-width:210px"><option>All Roles</option><option>Parent</option><option>Child</option><option>Therapist</option><option>Teacher</option><option>School Admin</option></select></div><div id="userTable"></div>`}function schoolsScreen(){return `<div class="row between"><div><h1>Schools</h1><p class="muted">Manage school pilots and platform access.</p></div><button class="btn primary" onclick="alert('School invitation form opened in demo.')">Invite School</button></div><div class="tableWrap"><table class="table"><thead><tr><th>School</th><th>Students</th><th>Teachers</th><th>Status</th></tr></thead><tbody><tr><td>Bright Future Inclusive School</td><td>126</td><td>24</td><td><span class="tag">Active</span></td></tr><tr><td>Sunrise School</td><td>88</td><td>18</td><td><span class="tag warn">Pilot</span></td></tr></tbody></table></div>`}function resourceAdminScreen(){return `<div class="row between"><div><h1>Resource Management</h1><p class="muted">Create, edit and organize trusted content.</p></div><button id="addResource" class="btn primary">Add Resource</button></div><div class="grid">${state.resources.map(r=>`<article class="card c4"><span class="pill">${esc(r.cat)}</span><h3>${esc(r.title)}</h3><p>${r.time} read</p><button class="btn danger deleteResource" data-id="${r.id}">Delete</button></article>`).join('')}</div>`}function marketplaceAdminScreen(){return `<h1>Marketplace Management</h1><div class="tableWrap"><table class="table"><thead><tr><th>Product</th><th>Creator</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${p.icon} ${esc(p.title)}</td><td>${esc(p.creator)}</td><td>₹${p.price}</td><td><span class="tag ${p.status==='Active'?'':'warn'}">${p.status}</span></td><td><button class="btn soft toggleProduct" data-id="${p.id}">${p.status==='Active'?'Send to Review':'Approve'}</button></td></tr>`).join('')}</tbody></table></div>`}function moderationScreen(){const pending=state.products.filter(p=>p.status==='Review');return `<h1>Content Moderation</h1>${pending.length?`<div class="grid">${pending.map(p=>`<article class="card c4"><div class="productIcon">${p.icon}</div><h3>${esc(p.title)}</h3><p>Created by ${esc(p.creator)}</p><button class="btn primary approveProduct" data-id="${p.id}">Approve</button></article>`).join('')}</div>`:emptyScreen('No content waiting for review')}function platformNotificationsScreen(){return `<h1>Platform Notifications</h1><div class="card" style="max-width:760px"><label>Title</label><input id="pnTitle" class="field"><label>Message</label><textarea id="pnBody" class="field" rows="5"></textarea><button id="sendPlatformNotification" class="btn primary">Send Notification</button></div>`}function auditScreen(){return `<h1>Audit Log</h1><div class="tableWrap"><table class="table"><tr><th>Time</th><th>Actor</th><th>Action</th></tr><tr><td>Today 10:42</td><td>Platform Admin</td><td>Updated user profile</td></tr><tr><td>Today 09:30</td><td>Neha Sharma</td><td>Added classroom observation</td></tr><tr><td>Yesterday</td><td>Dr. Priya Gupta</td><td>Shared session note</td></tr></table></div>`}function emptyScreen(t){return `<div class="card empty"><div style="font-size:55px">🐞</div><h2>${esc(t)}</h2><p class="muted">Nothing here yet. This screen is ready for the next workflow.</p></div>`}function bindApp(page){if(page==='checkin'){$$('.mood').forEach(b=>b.onclick=()=>{selectedMood=b.dataset.mood;$$('.mood').forEach(x=>x.classList.toggle('selected',x===b))});$('#saveMood').onclick=()=>{if(!selectedMood)return alert('Please choose a mood.');const score={Happy:9,Calm:8,Okay:6,Worried:4,Sad:3,Angry:2,Overwhelmed:2,Tired:5}[selectedMood];state.moods.push({id:Date.now(),date:'Today',mood:selectedMood,score,note:$('#moodNote').value.trim()});save();alert('Mood recorded.');go(`app/${state.role}/dashboard`)}}if(page==='mood-history')$('#exportMoods').onclick=()=>download('autic-moods.csv',['Date,Mood,Score,Note',...state.moods.map(m=>[m.date,m.mood,m.score,m.note].join(','))].join('\n'));if(page==='reports'){ $('#downloadReport').onclick=()=>download('autic-weekly-report.csv',['Date,Mood,Score,Note',...state.moods.map(m=>[m.date,m.mood,m.score,m.note].join(','))].join('\n'));$('#printReport').onclick=()=>print()}if(page==='calm')bindBreathing();if(page==='resources')bindResources();if(page==='appointments'){$('#addAppointment').onclick=appointmentModal;$$('.deleteAppointment').forEach(b=>b.onclick=()=>{state.appointments=state.appointments.filter(a=>a.id!==+b.dataset.id);save();renderApp(page)})}if(page==='marketplace'){$$('.addCart').forEach(b=>b.onclick=()=>{state.cart.push(+b.dataset.id);save();renderApp(page)});$('#viewCart').onclick=cartModal}if(page==='notifications'){$('#markAll').onclick=()=>{state.notifications.forEach(n=>n.read=true);save();renderApp(page)};$$('.deleteNotification').forEach(b=>b.onclick=()=>{state.notifications=state.notifications.filter(n=>n.id!==+b.dataset.id);save();renderApp(page)})}if(page==='settings'){$('#darkToggle').onchange=()=>{state.theme=$('#darkToggle').checked?'dark':'light';save();renderApp(page)};$('#resetData').onclick=()=>{localStorage.removeItem('autic-fresh-v1');location.reload()}}if(page==='drawing')bindCanvas();if(page==='voice')$('#fakeRecord').onclick=()=>{$('#recordStatus').textContent='Recording…';setTimeout(()=>$('#recordStatus').textContent='Demo voice note saved.',1800)};if(page==='session-notes')$('#saveNote').onclick=()=>{const t=$('#newNote').value.trim();if(!t)return;state.notes.unshift({id:Date.now(),by:'Dr. Priya Gupta',date:'Today',text:t});state.notifications.unshift({id:Date.now()+1,title:'Therapist feedback shared',body:'Dr. Priya added a new session note.',read:false});save();renderApp(page)};if(page==='observations')$('#saveObservation').onclick=()=>{const t=$('#newObservation').value.trim();if(!t)return;state.observations.unshift({id:Date.now(),by:'Neha Sharma',date:'Today',text:t});state.notifications.unshift({id:Date.now()+1,title:'Teacher observation shared',body:'Neha added a classroom observation.',read:false});save();renderApp(page)};if(page==='users')bindUsers();if(page==='resources-admin'){$('#addResource').onclick=resourceModal;$$('.deleteResource').forEach(b=>b.onclick=()=>{state.resources=state.resources.filter(r=>r.id!==+b.dataset.id);save();renderApp(page)})}if(page==='marketplace-admin'||page==='moderation'){$$('.toggleProduct,.approveProduct').forEach(b=>b.onclick=()=>{const p=state.products.find(x=>x.id===+b.dataset.id);p.status=p.status==='Active'?'Review':'Active';save();renderApp(page)})}if(page==='notifications-admin')$('#sendPlatformNotification').onclick=()=>{const t=$('#pnTitle').value.trim(),body=$('#pnBody').value.trim();if(!t||!body)return alert('Enter title and message.');state.notifications.unshift({id:Date.now(),title:t,body,read:false});save();alert('Notification sent in demo.')};if(page==='child-profile')$('#editChild').onclick=childModal}function bindResources(){const draw=arr=>{$('#resourceGrid').innerHTML=resourceCards(arr);$$('.openResource').forEach(b=>b.onclick=()=>openResource(+b.dataset.id));$$('.bookmark').forEach(b=>b.onclick=()=>{const r=state.resources.find(x=>x.id===+b.dataset.id);r.saved=!r.saved;save();bindResources();draw(state.resources)})};$('#resourceSearch').oninput=()=>draw(state.resources.filter(r=>JSON.stringify(r).toLowerCase().includes($('#resourceSearch').value.toLowerCase())));draw(state.resources)}function bindBreathing(){seconds=60;running=false;const c=$('#breathCircle'),t=$('#timerText');const tick=()=>{if(!running)return;if(seconds<=0){clearInterval(breathTimer);running=false;state.calmSessions++;save();c.textContent='Complete';return}seconds--;t.textContent='00:'+String(seconds).padStart(2,'0');if(seconds%4===0){c.className='breath '+((seconds/4)%2?'in':'out');c.textContent=((seconds/4)%2)?'Breathe in':'Breathe out'}};$('#startBreath').onclick=()=>{if(!running){running=true;breathTimer=setInterval(tick,1000)}};$('#pauseBreath').onclick=()=>{running=false;clearInterval(breathTimer);c.textContent='Paused'};$('#resetBreath').onclick=()=>{running=false;clearInterval(breathTimer);seconds=60;t.textContent='01:00';c.className='breath';c.textContent='Ready'}}function bindCanvas(){const canvas=$('#drawCanvas'),ctx=canvas.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#2d6cdf';let drawing=false;const pos=e=>{const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*(canvas.width/r.width),y:(p.clientY-r.top)*(canvas.height/r.height)}};const start=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onmousedown=start;canvas.onmousemove=move;canvas.onmouseup=()=>drawing=false;canvas.onmouseleave=()=>drawing=false;canvas.ontouchstart=start;canvas.ontouchmove=move;canvas.ontouchend=()=>drawing=false;$('#clearCanvas').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height)}function bindUsers(){const draw=()=>{const q=$('#userSearch').value.toLowerCase(),role=$('#roleFilter').value;const arr=state.users.filter(u=>(role==='All Roles'||u.role===role)&&JSON.stringify(u).toLowerCase().includes(q));$('#userTable').innerHTML=`<div class="tableWrap"><table class="table"><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>School</th><th>Linked</th><th>Action</th></tr></thead><tbody>${arr.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)}</span></td><td>${u.role}</td><td><span class="tag ${u.status==='Active'?'':'warn'}">${u.status}</span></td><td>${esc(u.school)}</td><td>${esc(u.linked)}</td><td><button class="btn soft editUser" data-id="${u.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;$$('.editUser').forEach(b=>b.onclick=()=>userModal(+b.dataset.id))};$('#userSearch').oninput=draw;$('#roleFilter').onchange=draw;$('#addUser').onclick=()=>userModal(0);$('#exportUsers').onclick=()=>download('autic-users.csv',['Name,Email,Role,Status,School,Linked',...state.users.map(u=>[u.name,u.email,u.role,u.status,u.school,u.linked].join(','))].join('\n'));draw()}function showModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.remove('hidden')}$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');function userModal(id){const u=id?state.users.find(x=>x.id===id):{name:'',email:'',role:'Parent',status:'Active',school:'Bright Future Inclusive School',linked:'—'};showModal(id?'Edit User':'Add User',`<label>Name</label><input id="uName" class="field" value="${esc(u.name)}"><label>Email</label><input id="uEmail" class="field" value="${esc(u.email)}"><div class="grid"><div class="c6"><label>Role</label><select id="uRole" class="field">${['Parent','Child','Therapist','Teacher','School Admin'].map(x=>`<option ${x===u.role?'selected':''}>${x}</option>`).join('')}</select></div><div class="c6"><label>Status</label><select id="uStatus" class="field">${['Active','Invited','Suspended'].map(x=>`<option ${x===u.status?'selected':''}>${x}</option>`).join('')}</select></div></div><label>School</label><input id="uSchool" class="field" value="${esc(u.school)}"><label>Linked User / Child</label><input id="uLinked" class="field" value="${esc(u.linked)}"><div class="row between"><button id="deleteUser" class="btn danger ${id?'':'hidden'}">Delete</button><button id="saveUser" class="btn primary">Save User</button></div>`);$('#saveUser').onclick=()=>{const d={name:$('#uName').value.trim(),email:$('#uEmail').value.trim(),role:$('#uRole').value,status:$('#uStatus').value,school:$('#uSchool').value.trim(),linked:$('#uLinked').value.trim()};if(!d.name||!d.email)return alert('Name and email required.');id?Object.assign(u,d):state.users.push({id:Date.now(),...d});save();$('#modal').classList.add('hidden');renderApp('users')};if(id)$('#deleteUser').onclick=()=>{state.users=state.users.filter(x=>x.id!==id);save();$('#modal').classList.add('hidden');renderApp('users')}}function appointmentModal(){showModal('Add Appointment',`<label>Title</label><input id="aTitle" class="field"><label>Date</label><input id="aDate" type="date" class="field"><label>Time</label><input id="aTime" type="time" class="field"><button id="saveAppointment" class="btn primary">Save Appointment</button>`);$('#saveAppointment').onclick=()=>{if(!$('#aTitle').value||!$('#aDate').value)return alert('Enter title and date.');state.appointments.push({id:Date.now(),title:$('#aTitle').value,date:$('#aDate').value,time:$('#aTime').value});save();$('#modal').classList.add('hidden');renderApp('appointments')}}function cartModal(){const items=state.cart.map(id=>state.products.find(p=>p.id===id)).filter(Boolean),total=items.reduce((s,p)=>s+p.price,0);showModal('Your Cart',items.length?items.map(p=>`<p>${p.icon} ${esc(p.title)} — ₹${p.price}</p>`).join('')+`<h3>Total: ₹${total}</h3><button id="checkout" class="btn primary">Complete Demo Checkout</button>`:`<div class="empty"><h3>Your cart is empty</h3></div>`);if($('#checkout'))$('#checkout').onclick=()=>{state.cart=[];save();$('#modalBody').innerHTML='<div class="empty"><div style="font-size:55px">✓</div><h2>Demo order confirmed</h2><p>No real payment was processed.</p></div>'}}function resourceModal(){showModal('Add Resource',`<label>Title</label><input id="rTitle" class="field"><label>Category</label><input id="rCat" class="field"><label>Reading Time</label><input id="rTime" class="field" value="5 min"><button id="saveResource" class="btn primary">Save Resource</button>`);$('#saveResource').onclick=()=>{if(!$('#rTitle').value.trim())return;state.resources.push({id:Date.now(),title:$('#rTitle').value.trim(),cat:$('#rCat').value.trim()||'General',time:$('#rTime').value.trim(),saved:false});save();$('#modal').classList.add('hidden');renderApp('resources-admin')}}function childModal(){showModal('Edit Child Profile',`<label>Name</label><input id="cName" class="field" value="${esc(state.child.name)}"><label>Age</label><input id="cAge" class="field" type="number" value="${state.child.age}"><label>Grade</label><input id="cGrade" class="field" value="${esc(state.child.grade)}"><label>Interests</label><textarea id="cLikes" class="field">${esc(state.child.likes)}</textarea><label>Sensory Profile</label><textarea id="cSensory" class="field">${esc(state.child.sensory)}</textarea><button id="saveChild" class="btn primary">Save Profile</button>`);$('#saveChild').onclick=()=>{Object.assign(state.child,{name:$('#cName').value,age:+$('#cAge').value,grade:$('#cGrade').value,likes:$('#cLikes').value,sensory:$('#cSensory').value});save();$('#modal').classList.add('hidden');renderApp('child-profile')}}function openResource(id){const r=state.resources.find(x=>x.id===id);showModal(r.title,`<span class="pill">${esc(r.cat)}</span><p>This is a demonstration article preview. Production content would include reviewed plain-language guidance, practical tips and related resources.</p><button class="btn primary" onclick="document.getElementById('modal').classList.add('hidden')">Finish Reading</button>`)}function openProduct(id){const p=state.products.find(x=>x.id===id);showModal(p.title,`<div class="productIcon">${p.icon}</div><span class="pill">Created by ${esc(p.creator)}</span><h2>₹${p.price}</h2><p>This creator profile would include biography, story, creations, achievements and reviews.</p>`)}function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save();render()}function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}render();</script></body></html>
