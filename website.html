<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NeuroLumina AUTIC — accessible technology for neurodivergent individuals, families, therapists and schools."><title>NeuroLumina — AUTIC</title><style>:root{--blue:#2d6cdf;--teal:#3db7a3;--amber:#f6b547;--ink:#172033;--muted:#667085;--line:#e4e7ec;--bg:#fafbfd;--surface:#f4f6f8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:16px/1.6 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.container{width:min(1180px,92vw);margin:auto}.top{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--teal));box-shadow:0 10px 25px #2d6cdf30}.links{display:flex;align-items:center;gap:20px}.links a{font-size:14px;color:#475467}.links a:hover,.links a.active{color:var(--blue);font-weight:700}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:15px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff;box-shadow:0 8px 24px #2d6cdf30}.secondary{background:#edf4ff;color:var(--blue)}.hero{padding:86px 0 64px;background:radial-gradient(circle at 85% 10%,#dff5ef,transparent 32%),radial-gradient(circle at 10% 20%,#e4edff,transparent 34%)}.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center}.eyebrow{display:inline-block;padding:7px 12px;border-radius:999px;background:#eaf8f4;color:#237b67;font-size:13px;font-weight:800}.hero h1{font-size:clamp(42px,6vw,72px);line-height:1.02;margin:18px 0}.hero p{font-size:20px;color:var(--muted);max-width:720px}.hero-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 22px 65px #2d6cdf18}.moodrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mood{background:var(--surface);border-radius:16px;padding:14px;text-align:center}.mood b{display:block;font-size:13px}.section{padding:76px 0}.section.alt{background:#fff}.section h2{font-size:clamp(32px,4vw,48px);line-height:1.15;margin:0 0 14px}.lead{font-size:19px;color:var(--muted);max-width:760px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:30px}.card{grid-column:span 4;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}.alt .card{background:var(--bg)}.card h3{margin:10px 0}.icon{width:48px;height:48px;border-radius:16px;background:#edf4ff;display:grid;place-items:center;font-size:24px}.wide{grid-column:span 6}.full{grid-column:span 12}.stat{font-size:36px;font-weight:900;color:var(--blue)}.ecosystem{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.eco{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:center}.pagehero{padding:64px 0 44px;background:linear-gradient(135deg,#edf4ff,#effbf8)}.pagehero h1{font-size:52px;margin:0 0 10px}.price{font-size:42px;font-weight:900}.faq details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:12px 0}.faq summary{cursor:pointer;font-weight:800}.form{max-width:760px}.field{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:14px;background:#fff;margin:6px 0 16px}.footer{background:#101828;color:#d0d5dd;padding:52px 0}.footergrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}.footer a{display:block;margin:8px 0;color:#d0d5dd}.notice{padding:16px;border-radius:16px;background:#fff8e7;border:1px solid #f6d58d}.mobile{display:none}@media(max-width:900px){.links{display:none}.mobile{display:inline-flex}.hero-grid{grid-template-columns:1fr}.grid .card,.wide{grid-column:span 12}.ecosystem{grid-template-columns:repeat(2,1fr)}.footergrid{grid-template-columns:1fr 1fr}.pagehero h1{font-size:40px}}@media(max-width:560px){.ecosystem,.footergrid{grid-template-columns:1fr}.hero{padding-top:52px}.hero h1{font-size:44px}}</style></head><body><header class="top"><div class="container nav"><a class="brand" href="website.html"><span class="logo">N</span><span>NeuroLumina</span></a><nav class="links" id="links"></nav><div style="display:flex;gap:10px"><a class="btn secondary" href="index.html">Login</a><a class="btn primary" href="index.html">Open Demo App</a></div></div></header><main id="page"></main><footer class="footer"><div class="container footergrid"><div><div class="brand"><span class="logo">N</span><span>NeuroLumina</span></div><p>Designing technology that understands neurodiversity.</p></div><div><b>Company</b><a href="website.html?page=about">About</a><a href="website.html?page=contact">Contact</a><a href="website.html?page=faq">FAQ</a></div><div><b>Product</b><a href="website.html?page=autic">AUTIC</a><a href="website.html?page=features">Features</a><a href="website.html?page=pricing">Pricing</a></div><div><b>Legal</b><a href="website.html?page=privacy">Privacy</a><a href="website.html?page=terms">Terms</a></div></div></footer><script>'use strict';const pages=['home','about','autic','features','resources','marketplace','pricing','contact','faq','privacy','terms'];const names={home:'Home',about:'About',autic:'AUTIC',features:'Features',resources:'Resources',marketplace:'Marketplace',pricing:'Pricing',contact:'Contact',faq:'FAQ',privacy:'Privacy',terms:'Terms'};const p=new URLSearchParams(location.search).get('page')||'home';document.title=(names[p]||'NeuroLumina')+' — NeuroLumina';document.getElementById('links').innerHTML=pages.slice(0,8).map(x=>`<a class="${x===p?'active':''}" href="website.html?page=${x}">${names[x]}</a>`).join('');const card=(i,t,d)=>`<article class="card"><div class="icon">${i}</div><h3>${t}</h3><p>${d}</p></article>`;const home=`<section class="hero"><div class="container hero-grid"><div><span class="eyebrow">Technology that adapts to people</span><h1>Helping before the meltdown happens.</h1><p>AUTIC connects children, parents, therapists and schools through one calm, accessible support platform.</p><div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn primary" href="index.html">Explore the Live Demo</a><a class="btn secondary" href="website.html?page=autic">Discover AUTIC</a></div></div><div class="hero-card"><div style="display:flex;justify-content:space-between"><div><b>Good morning, Aarav</b><p style="margin:4px 0;color:var(--muted)">How are you feeling today?</p></div><div style="font-size:42px">🐞</div></div><div class="moodrow"><div class="mood">😊<b>Happy</b></div><div class="mood">😌<b>Calm</b></div><div class="mood">😟<b>Worried</b></div><div class="mood">😣<b>Overwhelmed</b></div></div><div class="notice" style="margin-top:16px"><b>Pattern insight</b><br>Aarav often feels calmer after a short sensory break.</div></div></div></section><section class="section alt"><div class="container"><span class="eyebrow">Why NeuroLumina</span><h2>One connected ecosystem for everyday support.</h2><p class="lead">Families currently manage therapy notes, school communication, mood observations and calming activities across disconnected tools. NeuroLumina brings them together.</p><div class="grid">${card('🧠','Understand patterns','Track emotions, observations and activities over time without overwhelming users.')}${card('🤝','Strengthen collaboration','Help parents, therapists and educators work from shared, consent-based information.')}${card('🌿','Encourage independence','Give children accessible tools to express feelings and practice calming techniques.')}</div></div></section><section class="section"><div class="container"><h2>The AUTIC ecosystem</h2><div class="ecosystem"><div class="eco">👩‍👦<br><b>Parent Workspace</b></div><div class="eco">🧒<br><b>Child Workspace</b></div><div class="eco">🩺<br><b>Therapist Workspace</b></div><div class="eco">🏫<br><b>School Workspace</b></div><div class="eco">⚙️<br><b>Operations Console</b></div></div></div></section><section class="section alt"><div class="container"><h2>Success measured by meaningful support.</h2><div class="grid"><div class="card"><div class="stat">&lt; 60 sec</div><p>Target mood check-in completion.</p></div><div class="card"><div class="stat">3 taps</div><p>Maximum navigation depth to core features.</p></div><div class="card"><div class="stat">WCAG 2.2 AA</div><p>Accessibility standard for the platform.</p></div></div></div></section>`;const about=`${hero('About NeuroLumina','We build thoughtful, accessible and evidence-informed technology for neurodivergent individuals.')}<section class="section"><div class="container"><div class="grid"><article class="card wide"><h2>Why we exist</h2><p>Parents often juggle appointments, school updates, handwritten notes, breathing exercises and emotional observations across multiple platforms. NeuroLumina exists to bridge these gaps and improve collaboration without replacing therapists, teachers or caregivers.</p></article><article class="card wide"><h2>Our vision</h2><p>To build the world's most trusted ecosystem of technology that empowers neurodivergent individuals and strengthens the people who support them.</p></article>${card('💙','Empathy','Every decision begins by understanding the lived experiences of users.')}${card('♿','Accessibility','Inclusive design is integrated into every stage of product development.')}${card('🔐','Trust','Families retain control of their data and privacy is never optional.')}${card('✨','Simplicity','Technology should reduce cognitive load rather than create more work.')}${card('🤝','Collaboration','Better outcomes happen when families, therapists and educators work together.')}${card('🌱','Continuous improvement','Every release should become more useful, accessible and inclusive.')}</div></div></section>`;const autic=`${hero('Introducing AUTIC','An integrated digital platform designed to support autistic individuals and the people who care for them.')}<section class="section"><div class="container"><h2>Prevention over reaction.</h2><p class="lead">AUTIC helps users recognize emotional patterns early and provides practical emotional-regulation tools before distress escalates.</p><div class="grid">${card('😊','Mood Check-ins','Quick daily emotional logging with optional notes, voice and drawing.')}${card('🌬️','Calm Space','Breathing, grounding, stretching and quiet-timer activities.')}${card('📈','Pattern Insights','Simple visual trends that help caregivers understand recurring patterns.')}${card('📄','Reports','Weekly, monthly and custom reports for parents and authorized professionals.')}${card('📚','Resource Centre','Trusted educational articles, videos, guides and downloads.')}${card('🎨','Creator Marketplace','A platform celebrating products and artwork created by autistic individuals.')}</div><div class="notice" style="margin-top:28px"><b>AUTIC does not diagnose autism, replace medical advice, replace licensed therapists or guarantee prevention of meltdowns.</b></div></div></section>`;const features=`${hero('Features','Every feature is designed to reduce stress, improve understanding and support independence.')}<section class="section"><div class="container"><div class="grid">${card('🔑','Secure identity','Role-based access for parents, children, therapists, teachers and administrators.')}${card('👩‍👦','Parent dashboard','Child profiles, mood history, insights, reports, appointments and resources.')}${card('🧒','Child workspace','A distraction-free environment with one primary action at a time.')}${card('🩺','Therapist workspace','Assigned children, reports, session notes and recommendations.')}${card('🏫','School workspace','Student observations, reports, resources and parent collaboration.')}${card('🔔','Notifications','Gentle reminders and collaborative updates without demanding language.')}${card('🔎','Universal search','Search authorized children, resources, reports, help and settings.')}${card('🌙','Accessibility controls','Large text, high contrast, reduced motion, dark mode and Lumi preferences.')}${card('📊','Analytics','Meaningful engagement metrics without compromising user privacy.')}</div></div></section>`;const resources=`${hero('Resource Centre','Trusted information presented in plain language with practical next steps.')}<section class="section"><div class="container"><div class="grid">${['Understanding Autism','Daily Tips','Communication','Sensory Support','School Support','Parent Wellbeing','Therapy','Success Stories','Videos'].map((x,i)=>card(['🧩','🌞','💬','🎧','🏫','💙','🩺','🌟','▶️'][i],x,'Articles, guides and tools designed for families, professionals and educators.')).join('')}</div></div></section>`;const marketplace=`${hero('Creator Marketplace','Celebrating creativity before commerce.')}<section class="section"><div class="container"><p class="lead">Every product card highlights the creator, their story and their achievements.</p><div class="grid">${product('Sunrise Garden Painting','Created by Aarav','₹450','🎨')}${product('Handmade Greeting Cards','Created by Meera','₹299','💌')}${product('Sensory Texture Board','Created by Vihaan','₹799','🧸')}${product('Nature Photography Print','Created by Anaya','₹599','📷')}${product('Colour Pattern Notebook','Created by Kabir','₹349','📒')}${product('Clay Animal Collection','Created by Tara','₹899','🐘')}</div></div></section>`;const pricing=`${hero('Simple pilot pricing','Plans designed for families, professionals and schools.')}<section class="section"><div class="container"><div class="grid"><article class="card"><span class="eyebrow">Family</span><div class="price">₹499</div><p>per month</p><p>Parent and child workspaces, mood tracking, Calm Space, reports and resources.</p><a class="btn secondary" href="index.html">Try Demo</a></article><article class="card" style="border:2px solid var(--blue)"><span class="eyebrow">School Pilot</span><div class="price">Custom</div><p>for one school</p><p>Teacher and school workspaces, parent onboarding, student profiles, reports and pilot support.</p><a class="btn primary" href="website.html?page=contact">Request Pilot</a></article><article class="card"><span class="eyebrow">Professional</span><div class="price">₹999</div><p>per month</p><p>Therapist workspace, assigned-child reports, notes, recommendations and resource sharing.</p><a class="btn secondary" href="index.html">Try Demo</a></article></div><p class="notice">Pricing shown here is for demonstration and is not defined in the PRD. Final commercial plans require validation.</p></div></section>`;const contact=`${hero('Contact NeuroLumina','Start a conversation about a family, therapist or school pilot.')}<section class="section"><div class="container form"><label>Name</label><input class="field" id="n"><label>Email</label><input class="field" id="e" type="email"><label>Organization</label><input class="field" id="o"><label>How can we help?</label><textarea class="field" id="m" rows="6"></textarea><button class="btn primary" onclick="submitForm()">Send Enquiry</button><p id="sent"></p></div></section>`;const faq=`${hero('Frequently Asked Questions','Clear answers about AUTIC and the NeuroLumina ecosystem.')}<section class="section"><div class="container faq">${faqItem('Does AUTIC diagnose autism?','No. AUTIC does not diagnose autism and does not replace medical advice or licensed professional care.')}${faqItem('Who can use AUTIC?','Parents, caregivers, autistic children, therapists, teachers, schools and authorized administrators.')}${faqItem('Who owns the data?','Users and families retain control of their information. The product philosophy states that user data should never be monetized.')}${faqItem('Can schools view every child?','No. Access is role-based and limited to authorized and assigned users with appropriate consent.')}${faqItem('Is AUTIC accessible?','The product targets WCAG 2.2 AA and supports keyboard navigation, screen readers, reduced motion, high contrast and text scaling.')}${faqItem('Is the AUTIC Pad available?','No. The AUTIC Pad is future hardware and is not part of the current web MVP.')}</div></section>`;const privacy=`${hero('Privacy Policy','A clear, user-first approach to personal and child data.')}<section class="section"><div class="container"><div class="card full"><h2>Privacy by design</h2><p>AUTIC is intended to follow GDPR principles, India's DPDP Act, COPPA-inspired child protections where applicable and WCAG 2.2 AA accessibility. Users should be able to download data, delete accounts, export reports and control sharing permissions.</p><h3>Demo limitation</h3><p>This GitHub Pages demonstration stores dummy information only in the browser's local storage. It is not a production system and must not be used to enter real health, child or identifying information.</p></div></div></section>`;const terms=`${hero('Terms of Use','Important conditions for using this demonstration.')}<section class="section"><div class="container"><div class="card full"><h2>Demonstration only</h2><p>This website and application are a non-clinical dummy-data prototype created to demonstrate product workflows. They do not provide diagnosis, treatment, medical advice, emergency support or guaranteed prevention of distress.</p><h3>No real personal data</h3><p>Do not enter real medical records, child data, passwords, payment details or confidential school information into this public demonstration.</p><h3>Professional support</h3><p>AUTIC is designed to complement, not replace, licensed professionals, school support services or emergency healthcare.</p></div></div></section>`;function hero(t,d){return `<section class="pagehero"><div class="container"><span class="eyebrow">NeuroLumina</span><h1>${t}</h1><p class="lead">${d}</p></div></section>`}function product(t,c,pr,i){return `<article class="card"><div style="font-size:54px">${i}</div><h3>${t}</h3><p>${c}</p><b>${pr}</b><br><button class="btn secondary" style="margin-top:14px">View Creation</button></article>`}function faqItem(q,a){return `<details><summary>${q}</summary><p>${a}</p></details>`}function submitForm(){const n=document.getElementById('n').value.trim(),e=document.getElementById('e').value.trim();document.getElementById('sent').textContent=n&&e?'Thank you. Your demo enquiry has been recorded locally.':'Please enter your name and email.'}const content={home,about,autic,features,resources,marketplace,pricing,contact,faq,privacy,terms};document.getElementById('page').innerHTML=content[p]||home;</script></body></html>
